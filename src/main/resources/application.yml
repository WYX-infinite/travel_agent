spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: travel-agent
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/travel_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${TRAVEL_DB_USERNAME:${travel.local-secrets.db-username:root}}
    password: ${TRAVEL_DB_PASSWORD:${travel.local-secrets.db-password:}}
  data:
    redis:
      host: ${TRAVEL_REDIS_HOST:192.168.154.130}
      port: ${TRAVEL_REDIS_PORT:6379}
      password: ${TRAVEL_REDIS_PASSWORD:123321}

server:
  port: 8181
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

langchain4j:
  open-ai:
    chat-model:
      base-url: ${TRAVEL_AI_BASE_URL:${travel.ai.base-url:https://dashscope.aliyuncs.com/compatible-mode/v1}}
      api-key: ${DASHSCOPE_API_KEY:${travel.local-secrets.dashscope-api-key:}}
      model-name: ${TRAVEL_CHAT_MODEL:${travel.ai.chat-model:qwen-plus}}
      max-tokens: ${TRAVEL_MODEL_MAX_OUTPUT_TOKENS:4000}
      log-requests: false
      log-responses: false
    embedding-model:
      base-url: ${TRAVEL_AI_BASE_URL:${travel.ai.base-url:https://dashscope.aliyuncs.com/compatible-mode/v1}}
      api-key: ${DASHSCOPE_API_KEY:${travel.local-secrets.dashscope-api-key:}}
      model-name: ${TRAVEL_EMBEDDING_MODEL:${travel.ai.embedding-model:text-embedding-v3}}
    streaming-chat-model:
      base-url: ${TRAVEL_AI_BASE_URL:${travel.ai.base-url:https://dashscope.aliyuncs.com/compatible-mode/v1}}
      api-key: ${DASHSCOPE_API_KEY:${travel.local-secrets.dashscope-api-key:}}
      model-name: ${TRAVEL_CHAT_MODEL:${travel.ai.chat-model:qwen-plus}}
      max-tokens: ${TRAVEL_MODEL_MAX_OUTPUT_TOKENS:4000}
      log-requests: false
      log-responses: false

amap:
  base-url: ${TRAVEL_AMAP_BASE_URL:https://restapi.amap.com}
  api-key: ${AMAP_WEB_API_KEY:${travel.local-secrets.amap-web-api-key:}}

travel:
  planning:
    executor:
      pool-size: ${TRAVEL_PLANNING_POOL_SIZE:2}
      queue-capacity: ${TRAVEL_PLANNING_QUEUE_CAPACITY:8}
      await-termination-seconds: ${TRAVEL_PLANNING_SHUTDOWN_WAIT_SECONDS:30}
    sse:
      poll-interval-ms: ${TRAVEL_PLANNING_SSE_POLL_INTERVAL_MS:500}
      timeout-ms: ${TRAVEL_PLANNING_SSE_TIMEOUT_MS:1800000}
      max-connections: ${TRAVEL_PLANNING_SSE_MAX_CONNECTIONS:100}
  ai:
    context:
      model-context-window-tokens: ${TRAVEL_MODEL_CONTEXT_WINDOW_TOKENS:32768}
      max-estimated-input-tokens: ${TRAVEL_MAX_INPUT_TOKENS:16000}
      reserved-output-tokens: ${TRAVEL_MODEL_MAX_OUTPUT_TOKENS:4000}
      safety-margin-tokens: ${TRAVEL_CONTEXT_SAFETY_MARGIN_TOKENS:2000}
      max-knowledge-tokens: ${TRAVEL_MAX_KNOWLEDGE_TOKENS:4000}
      max-tool-fact-tokens: ${TRAVEL_MAX_TOOL_FACT_TOKENS:6000}
      max-memory-tokens: ${TRAVEL_MAX_MEMORY_TOKENS:500}
      max-poi-count: ${TRAVEL_MAX_PROMPT_POI_COUNT:20}
      max-knowledge-chunks: 5
  jwt:
    secret: ${TRAVEL_JWT_SECRET:${travel.local-secrets.jwt-secret:}}
    issuer: ${TRAVEL_JWT_ISSUER:travel-planning-agent}
    access-token-ttl: ${TRAVEL_JWT_ACCESS_TOKEN_TTL:2h}
  knowledge:
    index-file: ${TRAVEL_KNOWLEDGE_INDEX_FILE:data/index/knowledge-index.json}
    rebuild-on-startup: ${TRAVEL_KNOWLEDGE_REBUILD_ON_STARTUP:true}
    retrieval:
      # 0.0 是尚未校准时的显式安全默认值；上线前应以离线评测结果覆盖。
      min-score: ${TRAVEL_KNOWLEDGE_MIN_SCORE:0.0}
      candidate-limit: 8
      context-limit: 5
